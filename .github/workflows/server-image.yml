name: netbird-server image

# Builds the combined server image from this fork and publishes it to GHCR.
# Native arm64 runner: the control plane runs on Graviton and the build uses CGO.

on:
  push:
    branches: [server/signal-registration-frame]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Image tags
        id: tags
        run: |
          # Forks may carry no tags; fall back to the version this branch was cut from.
          base=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.81.1)
          sha=$(git rev-parse --short HEAD)
          echo "version=${base#v}-regframe.${sha}" >> "$GITHUB_OUTPUT"
          echo "base=${base#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: combined/Dockerfile.multistage
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/5tmate/netbird-server:${{ steps.tags.outputs.version }}
            ghcr.io/5tmate/netbird-server:${{ steps.tags.outputs.base }}-regframe
          cache-from: type=gha
          cache-to: type=gha,mode=max
